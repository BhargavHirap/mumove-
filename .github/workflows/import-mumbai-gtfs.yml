name: Import Mumbai GTFS data

on:
  push:
    branches: [main]
    paths:
      - "scripts/import-mumbai-gtfs.mjs"
      - ".github/workflows/import-mumbai-gtfs.yml"
  workflow_dispatch:
    inputs:
      feed_url:
        description: "Optional GTFS ZIP URL (defaults to the community Mumbai feed)"
        required: false
        type: string
  schedule:
    # Refresh the community static schedule weekly; this is not live vehicle tracking.
    - cron: "30 21 * * 0"

permissions:
  contents: read

concurrency:
  group: mumove-mumbai-gtfs-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required database secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in GitHub repository Actions secrets before running this importer."
            exit 1
          fi
      - name: Check out MUMOVE
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install importer dependencies
        run: npm install --no-audit --no-fund
      - name: Import and validate GTFS
        run: npm run import:gtfs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MUMOVE_GTFS_URL: ${{ inputs.feed_url }}
